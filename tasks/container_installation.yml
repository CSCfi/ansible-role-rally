---
- name: Ensure Podman is installed
  package:
    name:
      - podman
      - podman-docker
      - python3-podman

- name: Ensure data path exists
  file:
    state: directory
    name: /home/rally
    owner: 65500

- name: Run Rally container
  containers.podman.podman_container:
    name: "{{ container_name }}"
    command: "deployment create --name {{ item }}"
    image: "{{ container_image }}"
    volume:
      - "/home/rally:/home/rally/.rally"
    state: started
  loop: "{{ rally_deployments}}"
...

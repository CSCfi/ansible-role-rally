---
- name: Set Rally configuration file variable
  set_fact:
    rally_config_file: /home/rally/.rally/rally.conf

- name: Ensure Podman is installed
  package:
    name:
      - podman
      - podman-docker
      - python3-podman

- name: Ensure Rally home exists
  file:
    state: directory
    name: /home/rally
    owner: 65500

- name: Ensure Rally/rally exists
  file:
    state: directory
    name: /home/rally/rally
    owner: 65500

- name: Ensure Rally/rally/etc exists
  file:
    state: directory
    name: /home/rally/rally/etc
    owner: 65500

- name: Ensure Rally/rally/etc/rally exists
  file:
    state: directory
    name: /home/rally/rally/etc/rally
    owner: 65500

- name: Ensure rally.conf exists
  file:
    state: touch
    name: /home/rally/rally/etc/rally/rally.conf
    owner: 65500

- name: Rally configure swift operator role (container)
  ini_file:
    path: "/home/rally/rally/etc/rally/rally.conf"
    section: openstack
    option: swift_operator_role
    value: "{{ rally_tempest_swift_operator_role }}"
  when: rally_tempest_swift_operator_role is defined

- name: Rally configure swift reseller admin role (container)
  ini_file:
    path: "/home/rally/rally/etc/rally/rally.conf"
    section: openstack
    option: "swift_reseller_admin_role"
    value: "{{ rally_tempest_swift_reseller_admin_role }}"
  when: rally_tempest_swift_reseller_admin_role is defined

- name: Run Rally container to create database
  containers.podman.podman_container:
    name: "db_create_{{ container_name }}"
    command: "db create"
    image: "{{ container_image }}"
    volume:
      - "/home/rally:/home/rally/.rally"
      - "/home/rally/rally/etc/rally/rally.conf:/home/rally/.rally/rally.conf"
    state: started
...
